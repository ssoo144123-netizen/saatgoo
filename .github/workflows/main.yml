name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Persian Piper voices (offline TTS)
        run: |
          set -e
          mkdir -p app/src/main/assets
          for v in vits-piper-fa_IR-amir-medium vits-piper-fa_IR-ganji-medium; do
            curl -fL -o "/tmp/$v.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$v.tar.bz2"
            tar xjf "/tmp/$v.tar.bz2" -C app/src/main/assets
          done

      - name: Download sherpa-onnx native libraries
        run: |
          set -e
          curl -fL -o /tmp/sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p app/src/main/jniLibs
          tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp
          cp -r /tmp/jniLibs/* app/src/main/jniLibs/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK contents
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK  size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | grep -E "libsherpa-onnx-jni.so|model.onnx" || { echo "Offline TTS files missing from APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: saatgoo-debug
          path: app/build/outputs/apk/debug/*.apk
